<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('#check').onclick = function() {
                res = document.querySelector('#result');
                    if (document.querySelector('input').value.toLowerCase() === 'cat') {
                        res.innerHTML = 'Correct!';
                        res.style.color = '#02eb8a';
                    }
                    else {
                        res.innerHTML = 'Incorrect';
                        res.style.color = '#f7020f';
                    }
                };
            });
        </script>
        <title>My Webpage</title>
    </head>
    <body>
        <header class="header">
            <h1>Page 1</h1>
        </header>
        <main class="main">
            <h5>
                <p><img alt = "CS50x" width=40% src="https://yt3.googleusercontent.com/ytc/AIf8zZRxxv-lMXnpfUTvYu-h8B4PNRq2rET1mX29v7uMIg=s900-c-k-c0x00ffffff-no-rj"></p>
                <p>Which animal is this?</p>
                <p><input type="text"></input></p>
                <p><button id="check">Check Answer</button></p>
                <p id="result"></p>
            </h5>
        </main>
        <footer class="footer">
